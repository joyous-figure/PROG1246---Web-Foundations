<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>CSS Combinators</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/ex8.css">
  </head>
  <body>
    <main>
        <h1>This is a main heading.</h1>
        <p>This is a paragraph.</p>
        <p>This is another paragraph.</p>
        <section>
            <h2>Some heading</h2>
            <p>This paragraph is in a section after an h2.</p>
            <p>Another paragraph in a section after a p and h2 element.</p>
            <section>
                <h3>Subsection starts here...</h3>
                <p>A subsection paragraph.</p>
            </section>
        </section>
    </main>
    <p>This paragraph is outside of the main element.</p>
  </body>
</html>
